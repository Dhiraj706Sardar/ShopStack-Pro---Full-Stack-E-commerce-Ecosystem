name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # --- BACKEND JOB ---
  backend-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and Test Backend
        run: |
          cd backend
          mvn clean test
        env:
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
          CLOUDINARY_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test

      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-backend:latest ./backend

  # --- FRONTEND JOB ---
  frontend-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-frontend:latest ./frontend

  # --- SMOKE TEST (Docker Compose Validation) ---
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy .env for Smoke Test
        run: |
          cat <<EOF > backend/.env
          DB_URL=jdbc:mysql://db:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME=root
          DB_PASSWORD=root
          REDIS_HOST=redis
          REDIS_PORT=6379
          JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
          MAIL_USERNAME=test@test.com
          MAIL_PASSWORD=test
          MAIL_FROM=test@test.com
          STRIPE_SECRET_KEY=test
          STRIPE_PUBLISHABLE_KEY=test
          CLOUDINARY_NAME=test
          CLOUDINARY_API_KEY=test
          CLOUDINARY_API_SECRET=test
          EOF

      - name: Start Services with Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for services to be healthy..."
          sleep 40 # Increased wait time for MySQL

      - name: Check Backend Health
        run: |
          curl -v -f http://localhost:8080/actuator/health || (docker compose logs backend && exit 1)

      - name: Stop Services
        run: docker compose down

  # --- DOCKER PUSH (Only on Push to Main) ---
  docker-push:
    needs: [backend-build-test, frontend-build-test, smoke-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME }}/ecommerce-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-frontend:latest
