spring.application.name=ecommerce-backend

# Active Profile
spring.profiles.active=dev

# Common JWT Configuration
ecommerce.jwt.secret=${JWT_SECRET}
ecommerce.jwt.expiration=86400000
ecommerce.jwt.refreshExpiration=604800000

# Server Port
server.port=8081

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Common Email Settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Common Stripe Settings
stripe.currency=inr

# Common Cloudinary Configuration (If same for all)
cloudinary.cloud_name=${CLOUDINARY_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Common Redis Cache Settings
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
